<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111b24">
  <meta name="description" content="MyneSight RIIMPO321F wheeled front end loader training and assessment support application.">
  <title>RIIMPO321F Training and Assessment | MyneSight</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside>
      <div class="brand"><span>M</span><div><strong>MyneSight</strong><small>RTO 31900</small></div></div>
      <div class="unit"><b>RIIMPO321F</b><small>Release 3 · Queensland</small></div>
      <nav aria-label="Course navigation">
        <button data-view="overview" class="active"><i>01</i>Overview</button>
        <button data-view="training"><i>02</i>Training</button>
        <button data-view="practice"><i>03</i>Practice zone</button>
        <button data-view="theory"><i>04</i>Theory assessment</button>
        <button data-view="practical"><i>05</i>Practical assessment</button>
        <button data-view="evidence"><i>06</i>Evidence</button>
        <button data-view="sources"><i>07</i>Sources</button>
      </nav>
      <footer><div><span>Progress</span><b id="progressText">0%</b></div><div class="progress"><i id="progressBar"></i></div><small>Saved on this device</small></footer>
    </aside>
    <main id="main">
      <header>
        <div><span class="eyebrow">Civil construction operator program</span><h1 id="pageTitle">Overview</h1></div>
        <div class="candidate">
          <label>Candidate name<input id="candidateName" autocomplete="name"></label>
          <label>Student ID<input id="studentId"></label>
        </div>
      </header>
      <div id="notice" class="notice" role="status" hidden></div>
      <div id="content"></div>
    </main>
  </div>
  <noscript><p class="noscript">JavaScript is required to use this interactive training application.</p></noscript>
</body>
</html>
