text21181.addInnerText('<div id=\"text21181\"><a id=\"text21181anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text21181Font2\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text21181CircleBulletFont7.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text21181Font2\"  >The term \'Medicinal Cannabis products\' covers a range of cannabis preparations intended for therapeutic use, including pharmaceutical cannabis preparations, such as oils, tinctures and other extracts\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text21181Font2\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text21181Font2\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text21181CircleBulletFont7.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text21181Font2\"  >Historical evidence confirms the use of cannabis for millennia for medical and recreational purposes, as well as hemp fibre to create food, paper and clothing\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text21181Font2\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text21181Font2\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text21181CircleBulletFont7.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text21181Font2\"  >Increased media attention has prompted the government to act in the Medicinal Cannabis space and accelerate access to products</span ><span class=\"text21181Font3\" style=\"background-color:transparent\" >\n</span ></li >\n</ul >\n</div>\n');

text21182.addInnerText('<div id=\"text21182\"><a id=\"text21182anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text21182Font2\"  >In October 2016 the National Drug and Alcohol Research Centre (NDARC) was contracted to review evidence regarding Medicinal Cannabis in key medical conditions. \n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text21182Font2\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text21182Font2\"  >At the end of 2017, the TGA released five clinical guidance documents aimed at assisting doctors in the prescribing of Medicinal Cannabis products, to help identify suitable products to be used for a range of therapy areas. \n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text21182Font2\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text21182Font2\"  >The Guidance documents were produced using robust process through the NDARC and advice from clinical experts which will aim to provide a summary of the evidence available to individual clinicians, State and Territory health departments and the Commonwealth Department of Health.\n</span ></p >\n</div>\n');

ight:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text21183Font3\"  >Nausea and vomiting:</span ><span class=\"text21183Font4\"  > including cancer chemotherapy-induced nausea and vomiting (CINV) or AIDS related \n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text21183Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text21183Font3\"  >Multiple Sclerosis:</span ><span class=\"text21183Font4\"  > spasticity\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text21183Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text21183Font3\"  >Epilepsy:</span ><span class=\"text21183Font5\"  > </span ><span class=\"text21183Font4\"  >in children and in adults\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text21183Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  style=\"margin-left:0px;text-indent:0px;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text21183Font3\"  >Palliative Care:</span ><span class=\"text21183Font2\"  > </span ><span class=\"text21183Font4\"  >control of pain and increasing appetite </span ><span class=\"text21183Font6\" style=\"background-color:transparent\" >\n</span ></p >\n</div>\n');
