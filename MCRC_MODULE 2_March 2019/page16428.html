text16441.addInnerText('<div id=\"text16441\" style=\"overflow-y:auto;overflow-x:hidden;\"><a id=\"text16441anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16441Font2\"  >Dispensing</span ><span class=\"text16441Font3\" style=\"background-color:transparent\" >\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16441Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16441Font3\"  >Once a medical practitioner has received the required approvals, they may issue a prescription for their patient. The patient may then take this prescription to any pharmacy to have their medicinal cannabis dispensed.\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16441Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16441Font3\"  >There are no additional requirements under Victorian law that a pharmacy must follow in order to dispense a medicinal cannabis product, aside from those that apply to all </span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://www2.health.vic.gov.au/public-health/drugs-and-poisons/health-practitioners/pharmacists\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text16441Font5\"  >Schedule 4 or Schedule 8 drugs.</span></a ><span class=\"text16441Font3\" style=\"background-color:transparent\" >\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16441Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16441Font3\"  >Once a prescription has been issued, the pharmacy will need to contact the supplier to organise supply of the product. Within an institution such as a hospital, supply may be arranged through the pharmacy department.\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16441Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16441Font3\"  >For more information, check the Information for health professional\'s page:\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://www2.health.vic.gov.au/public-health/drugs-and-poisons/medicinal-cannabis/health-professionals \',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text16441Font6\"  >https://www2.health.vic.gov.au/public-health/drugs-and-poisons/medicinal-cannabis/health-professionals </span></a ><span class=\"text16441Font3\" style=\"background-color:transparent\" >\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16441Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16441Font7\"  >Note</span ><span class=\"text16441Font3\" style=\"background-color:transparent\" >\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16441Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16441Font3\"  >As of November 2017, Sativex is available to be dispensed in Victoria as a Schedule 8 medication.\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16441Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16441Font3\"  >For further information on becoming a Sativex prescriber, or for assistance with the online application process, please contact the VIC Drugs and Poisons Regulation department on 1300 364 545.</span ><span class=\"text16441Font8\" style=\"background-color:transparent\" >\n</span ></p >\n</div>\n');
text16441.build()

text16440.addInnerText('<div id=\"text16440\" style=\"overflow-y:auto;overflow-x:hidden;\"><a id=\"text16440anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:3px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16440Font2\"  >Overview<br />\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text16440Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16440CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16440Font3\"  >The Access to Medicinal Cannabis Act 2016 passed the Victorian Parliament on 12 April 2016, enabling access to Medicinal Cannabis to defined groups of patients. <br />\n&nbsp;</span ></li >\n<li  class=\"text16440Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16440CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16440Font3\"  >The Victorian Access to Medicinal Cannabis Scheme was launched in 2016. Under the scheme, Medicinal Cannabis products will be approved for medical practitioners to prescribe to eligible Victorian patients.<br />\n&nbsp;</span ></li >\n<li  class=\"text16440Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16440CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16440Font3\"  >Children with severe intractable epilepsy will be the first group to access Medicinal Cannabis products as part of the Victorian scheme in 2017.<br />\n&nbsp;</span ></li >\n<li  class=\"text16440Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16440CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16440Font3\"  >Note: Any medicinal cannabis product that contains more than two per cent THC is a schedule 8 medication.<br />\n&nbsp;</span ></li >\n<li  class=\"text16440Font5\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16440CircleBulletFont10.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16440Font3\"  >For more information on access, refer to </span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://www2.health.vic.gov.au/about/publications/factsheets/medicinal-cannabis-access-practitioners\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text16440Font5\"  >Access to Medicinal Cannabis in Victoria - Information for medical professionals</span></a ><span class=\"text16440Font3\"  > <br />\n&nbsp;</span ></li >\n<li  class=\"text16440Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16440CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><a href=\"javascript:var db = new jsDlgBox( \'16440\', \'Template\', \'page66079.html\', null, 800, 500, -1, -1, 0, 0 ); db.create();\"  ><span class=\"text16440Font6\"  >Figure 1: Approval process for Medicinal Cannabis in Victoria</span></a ><span class=\"text16440Font3\" style=\"background-color:transparent\" >\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16440Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16440Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16440Font2\"  >March 2019:\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16440Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text16440Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16440CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16440Font3\"  >In Victoria, any registered medical practitioner is able to prescribe medicinal cannabis for any patient with any condition, if they believe it is clinically appropriate and have obtained the required Commonwealth and/or state approvals.\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16440Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text16440Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16440CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16440Font3\"  >Prescribing medicinal cannabis follows the same process as for all other pharmaceutical medicines, with requirements dependent on:\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16440Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:24px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16440Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:24px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16440Font3\"  >1) Whether the product is registered on the </span ><a href=\"https://www.tga.gov.au/artg\"  ><span class=\"text16440Font7\"  >Australian Register of Therapeutic Goods (ARTG)</span></a ><span class=\"text16440Font3\"  >, and \n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:24px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16440Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:24px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16440Font3\"  >2) The Schedule of the product on the Australian Poisons Standard.\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16440Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text16440Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16440CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16440Font3\"  >All products not registered on the ARTG require approval from the Therapeutic Goods Administration (TGA) to be prescribed. This approval can be obtained through the TGA\'s </span ><a href=\"https://www.tga.gov.au/form/special-access-scheme\"  ><span class=\"text16440Font8\"  >Special Access Scheme</span></a ><span class=\"text16440Font3\"  >, or by becoming an </span ><a href=\"https://www.tga.gov.au/form/authorised-prescribers\"  ><span class=\"text16440Font9\"  >Authorised Prescriber</span></a ><span class=\"text16440Font3\"  >.\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16440Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text16440Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16440CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16440Font3\"  >Irrespective of registration on the ARTG, most medicinal cannabis products (other than pure cannabidiol (CBD) will require a </span ><a href=\"https://www2.health.vic.gov.au/public-health/drugs-and-poisons/patient-schedule-8-treatment-permits\"  ><span class=\"text16440Font10\"  >Victorian Schedule 8 treatment permit</span></a ><span class=\"text16440Font3\"  >. Exemptions from the requirement for treatment permits exist if the patient is in hospital, an aged care service or prison, or the indication for treatment is palliative care.\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16440Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text16440Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16440CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16440Font3\"  >Victorian (Schedule 8) and Commonwealth (TGA) approvals required to prescribe Schedule 8 medicinal cannabis products not listed on the ARTG can now be sought together via the </span ><a href=\"https://sas.tga.gov.au/\"  ><span class=\"text16440Font11\"  >TGA\'s single online application</span></a ><span class=\"text16440Font3\"  >. The above access pathways can be used by any medical practitioner, however the TGA may require evidence of specialist support for the proposed treatment.</span ><span class=\"text16440Font2\" style=\"background-color:transparent\" >\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16440Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text16440Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16440CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16440Font3\"  >For more information, check the Information for health professional\'s page:\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:24px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://www2.health.vic.gov.au/public-health/drugs-and-poisons/medicinal-cannabis/health-professionals \',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text16440Font12\"  >https://www2.health.vic.gov.au/public-health/drugs-and-poisons/medicinal-cannabis/health-professionals </span></a ><span class=\"text16440Font13\" style=\"background-color:transparent\" >\n</span ></p >\n</div>\n');
text16440.build()

text16439.addInnerText('<div id=\"text16439\" style=\"overflow-y:auto;overflow-x:hidden;\"><a id=\"text16439anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16439Font2\"  >Prescribing\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16439Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text16439Font4\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16439CircleBulletFont9.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16439Font4\"  >Monday 30th July, the TGA &nbsp;launched a new online portal for lodging applications for products covered under the Special Access Scheme, including cannabis medicines. This online lodgement system is currently available for health practitioners in NSW, Victoria, and Queensland and will provide prescribers with the ability to submit applications to the TGA and relevant State Health Department simultaneously. \n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16439Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text16439Font4\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16439CircleBulletFont9.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16439Font4\"  >The TGA advises that while lodgement of SAS applications and notifications via the online system is not mandatory, it is the preferred method of submission. \n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16439Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text16439Font4\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16439CircleBulletFont9.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16439Font4\"  >Further information about the TGA Special Access Scheme online system and how to register for access can be found </span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://www.tga.gov.au/special-access-scheme-online-system\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text16439Font5\"  >here.</span></a ><span class=\"text16439Font4\"  >  \n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16439Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text16439Font4\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16439CircleBulletFont9.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16439Font4\"  >Prescribing of medicinal cannabis products follows the same requirements as all other pharmaceutical medicines.\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16439Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text16439Font4\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16439CircleBulletFont9.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16439Font4\"  >If a product is registered on the ARTG, then it can be prescribed as per usual prescribing processes.\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16439Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text16439Font4\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16439CircleBulletFont9.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16439Font4\"  >Irrespective of whether the medicinal cannabis product is registered on the ARTG or not, if the medicinal cannabis product is a schedule 8 controlled drug then a Victorian Schedule 8 treatment permit is required. \n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16439Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text16439Font4\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16439CircleBulletFont9.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16439Font4\"  >For more information, check the Information for health professional\'s page:\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:24px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://www2.health.vic.gov.au/public-health/drugs-and-poisons/medicinal-cannabis/health-professionals \',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text16439Font7\"  >https://www2.health.vic.gov.au/public-health/drugs-and-poisons/medicinal-cannabis/health-professionals </span></a ><span class=\"text16439Font4\" style=\"background-color:transparent\" >\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16439Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16439Font4\"  >In Victoria, any medical practitioner can prescribe a medicinal cannabis product for their patient, if they believe it is clinically appropriate to do so. Medical practitioners do not need to gain accreditation, nor be specialists in a particular field.\n</span ></p >\n</div>\n');
