text19471.addInnerText('<div id=\"text19471\" style=\"overflow-y:auto;overflow-x:hidden;\"><a id=\"text19471anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19471Font2\"  >Prescribing<br /></span ><span class=\"text19471Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text19471Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19471CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19471Font3\"  >Prescribers do not require prior approval to prescribe Schedule 4 medicinal cannabis in NT<br />\n&nbsp;</span ></li >\n<li  class=\"text19471Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19471CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19471Font3\"  >Schedule 8 Medicinal Cannabis products may be prescribed by a Northern Territory doctor who is authorised under the Special Access or Authorised Prescriber Schemes administered by the TGA<br />\n&nbsp;</span ></li >\n<li  class=\"text19471Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19471CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19471Font3\"  >Prescribers do not need authorisation from NT Chief Health Officer (CHO), however must notify if persons will be on it for 8 weeks or more (as per the S8 regulations)<br />\n&nbsp;</span ></li >\n<li  class=\"text19471Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19471CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19471Font3\"  >Access is restricted to appropriate patients with certain medical conditions where there is evidence to support its therapeutic use (as per TGA and ODC recommendations)\n</span ></li >\n</ul >\n</div>\n');

text19472.addInnerText('<div id=\"text19472\"><a id=\"text19472anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19472Font2\"  >Overview<br /></span ><span class=\"text19472Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text19472Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19472CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19472Font3\"  >Northern Territory are following federal legislation of Medicinal Cannabis products, and scheduling according to the SUSMP, where Cannabis based products containing &lt;2% CBD is Schedule 4 and </span ><span class=\"text19472Font4\"  >all other products are Schedule 8 medications (non-restricted). <br />\n&nbsp;</span ></li >\n<li  class=\"text19472Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19472CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19472Font3\"  >At this stage, there has been no Medicinal Cannabis specific guidelines or requirements released by the Northern Territory Department of Health. \n</span ></li >\n</ul >\n</div>\n');

  >Summary of Requirements for Pharmacists - Medicines &amp; Poisons Control for</span></a ><span class=\"text19473Font3\"  > a summary of the key elements of the framework for the supply of Schedule 8 (S8) substances in NT.<br />\n&nbsp;</span ></li >\n<li  class=\"text19473Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19473CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19473Font3\"  >Schedule 4 Medicinal Cannabis prescriptions can be dispensed at any pharmacy (including interstate prescriptions). &nbsp;Commonwealth procedures must be correctly followed to access any Medicinal Cannabis product.\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19473Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  style=\"margin-left:0px;text-indent:0px;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19473Font4\"  >For further information, </span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://health.nt.gov.au/professionals/environmental-health/therapeutic-medicines-containing-cannabinoids-medicinal-cannabis\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text19473Font7\"  >click here.</span></a ><span class=\"text19473Font3\" style=\"background-color:transparent\" >\n</span ></p >\n</div>\n');
