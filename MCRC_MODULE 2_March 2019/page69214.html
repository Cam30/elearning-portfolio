text69215.addInnerText('<div id=\"text69215\" style=\"overflow-y:auto;overflow-x:hidden;\"><a id=\"text69215anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<p  legLH=\"1.641\" style=\"margin-left:0px;text-indent:0px;line-height:1.125;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span style=\"text-indent:0px\" id=\"embeded_image69219\"></span><span class=\"text69215Font3\" style=\"position:relative;top:-19px;\" >Medicinal Cannabis Readiness Course</span ><span class=\"text69215Font4\" style=\"position:relative;top:-19px;\" > </span ><span class=\"text69215Font5\" style=\"background-color:transparentposition:relative;top:-19px;\" >\n</span ></p >\n<p  legLH=\"1.691\" style=\"margin-left:0px;text-indent:0px;line-height:1.620;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text69215Font5\" style=\"position:relative;top:-4px;\" ><br /></span ><span class=\"text69215Font6\" style=\"position:relative;top:-19px;\" >Accreditation code: G2017047 </span ><!--InsertObject=31315--><span class=\"text69215Font5\" style=\"background-color:transparentposition:relative;top:-19px;\" >\n</span ></p >\n<p  legLH=\"1.691\" style=\"margin-left:0px;text-indent:0px;line-height:1.620;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text69215Font5\" style=\"position:relative;top:-4px;\" ><br />This activity has been accredited for 3 hours of Group 1 CPD (or 3 CPD credits) suitable for inclusion in an individual pharmacist’s CPD plan which can be converted to 3 hours of Group 2 CPD (or 6 CPD credits) upon successful completion of all relevant assessment activities (G2017047A, G2017047B, G2017047C).<br /><br /></span ><span class=\"text69215Font6\" style=\"position:relative;top:-4px;\" >Module 1: Introduction to Medicinal Cannabis (accreditation code: G2017047A)</span ><span class=\"text69215Font5\" style=\"position:relative;top:-4px;\" > \n</span ></p >\n<ol  start=\"1\" style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text69215Font5\" style=\"line-height:1.691;position:relative;padding-left:10px;list-style-type:decimal;margin-left:39px;margin-top:7px;margin-bottom:7px;\"><span class=\"text69215Font5\"  >Describe the compounds found within the cannabis plant which may be utilized for medicinal purposes\n</span ></li >\n<li  class=\"text69215Font5\" style=\"line-height:1.691;position:relative;padding-left:10px;list-style-type:decimal;margin-left:39px;margin-top:7px;margin-bottom:7px;\"><span class=\"text69215Font5\"  >Recognise the role of Cannabidiol (CBD) in the context of its medicinal use\n</span ></li >\n<li  class=\"text69215Font5\" style=\"line-height:1.691;position:relative;padding-left:10px;list-style-type:decimal;margin-left:39px;margin-top:7px;margin-bottom:7px;\"><span class=\"text69215Font5\"  >Describe the endocannabinoid system and the role of cannabinoid receptors\n</span ></li >\n<li  class=\"text69215Font5\" style=\"line-height:1.691;position:relative;padding-left:10px;list-style-type:decimal;margin-left:39px;margin-top:7px;margin-bottom:7px;\"><span class=\"text69215Font5\"  >Recognise the limitations of past clinical trials and available evidence for the use of cannabinoids<br /><br />This activity has been accredited for 1 hour of Group 1 CPD (1 CPD point) suitable for inclusion in an individual pharmacist’s CPD plan which can be converted to 1 hour of Group 2 CPD (or 2 CPD credits) upon successful completion of relevant assessment activities.<br /><br />Competency Standards <br />2010 - 6.1, 6.2, 7.1, 7.3<br />2016 - &nbsp;3.1, 3.2, 3.3, 3.5\n</span ></li >\n</ol >\n<p  legLH=\"1.691\" style=\"margin-left:0px;text-indent:0px;line-height:1.620;margin-top:7px;margin-bottom:7px;text-align:left;\" >\n<span class=\"text69215Font6\"  >Module 2: Access to Medicinal Cannabis (accreditation code: G2017047B)</span ><span class=\"text69215Font5\"  > \n</span ></p >\n<ol  start=\"1\" style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text69215Font5\" style=\"line-height:1.691;position:relative;padding-left:10px;list-style-type:decimal;margin-left:39px;margin-top:7px;margin-bottom:7px;\"><span class=\"text69215Font5\"  >Describe the legislative framework and commonwealth organisations underpinning the access to medicinal cannabis products in Australia\n</span ></li >\n<li  class=\"text69215Font5\" style=\"line-height:1.691;position:relative;padding-left:10px;list-style-type:decimal;margin-left:39px;margin-top:7px;margin-bottom:7px;\"><span class=\"text69215Font5\"  >Recognise the pathways for access to medicinal cannabis products under the Therapeutic Goods Administration (TGA)\n</span ></li >\n<li  class=\"text69215Font5\" style=\"line-height:1.691;position:relative;padding-left:10px;list-style-type:decimal;margin-left:39px;margin-top:7px;margin-bottom:7px;\"><span class=\"text69215Font5\"  >Recognise differing requirements for prescribing and dispensing medicinal cannabis dependent on State/Territory guidance and legislation\n</span ></li >\n</ol >\n<p  legLH=\"1.691\" style=\"margin-left:0px;text-indent:0px;line-height:1.620;margin-top:0px;margin-bottom:16px;text-align:left;\" >\n<span class=\"text69215Font5\"  >&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;This activity has been accredited for 1 hour of Group 1 CPD (1 CPD point) suitable for inclusion in an &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;individual pharmacist’s CPD plan which can be converted to 1 hour of Group 2 CPD (or 2 CPD &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;credits) upon successful completion of relevant assessment activities.<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Competency Standards <br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2010 - 1.1, 2.3, 3.3, 4.2, 4.3<br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2016 - 1.2, 2.2, 3.1, 3.2. 4.5<br /><br /></span ><span class=\"text69215Font6\"  >Module 3: Therapeutics of Medicinal Cannabis (accreditation code: G2017047C)</span ><span class=\"text69215Font5\" style=\"background-color:transparent\" >\n</span ></p >\n<ol  start=\"1\" style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text69215Font5\" style=\"line-height:1.691;position:relative;padding-left:10px;list-style-type:decimal;margin-left:39px;margin-top:7px;margin-bottom:7px;\"><span class=\"text69215Font5\"  >Describe the current available evidence for the clinical application of medicinal cannabis products\n</span ></li >\n<li  class=\"text69215Font5\" style=\"line-height:1.691;position:relative;padding-left:10px;list-style-type:decimal;margin-left:39px;margin-top:7px;margin-bottom:7px;\"><span class=\"text69215Font5\"  >Recognise the disease states for which clinical guidance is currently under development in Australia regarding the clinical application of medicinal cannabis products\n</span ></li >\n<li  class=\"text69215Font5\" style=\"line-height:1.691;position:relative;padding-left:10px;list-style-type:decimal;margin-left:39px;margin-top:7px;margin-bottom:7px;\"><span class=\"text69215Font5\"  >Identify issues relating to the pharmacokinetic properties and pharmacodynamics&nbsp;of cannabinoids\n</span ></li >\n<li  class=\"text69215Font5\" style=\"line-height:1.691;position:relative;padding-left:10px;list-style-type:decimal;margin-left:39px;margin-top:7px;margin-bottom:7px;\"><span class=\"text69215Font5\"  >Recognise the modes of administration for medicinal cannabis products, likely to be supported in the Australian context<br /><br />This activity has been accredited for 1 hour of Group 1 CPD (1 CPD point) suitable for inclusion in an individual pharmacist’s CPD plan which can be converted to 1 hour of Group 2 CPD (or 2 CPD credits) upon successful completion of relevant assessment activities.<br /><br />Competency Standards <br />2010 - 6.1, 6.2, 7.1, 7.2, 7.3<br />2016 - 3.1, 3.2, 3.3, 3.5<br />\n&nbsp;</span ></li >\n</ol >\n<p  legLH=\"1.691\" style=\"margin-left:0px;text-indent:0px;line-height:1.620;margin-top:7px;margin-bottom:7px;text-align:left;\" >\n<span class=\"text69215Font9\"  >Completing MCQ Assessment\n</span ></p >\n<p  legLH=\"1.691\" style=\"margin-left:0px;text-indent:0px;line-height:1.620;margin-top:7px;margin-bottom:7px;text-align:left;\" >\n<span class=\"text69215Font5\"  >At the conclusion of each module, you will be prompted to close [x] the module window and return to the </span ><span class=\"text69215Font6\"  >Guild Online Learner Portal </span ><span class=\"text69215Font5\"  >to complete the relevant assessment items. &nbsp;For each module, successful completion of the assessment requires a pass mark of </span ><span class=\"text69215Font6\"  >80% or greater </span ><span class=\"text69215Font5\"  >with a maximum of </span ><span class=\"text69215Font6\"  >two (2) attempts allowed\n</span ></p >\n<p  legLH=\"1.691\" style=\"margin-left:0px;text-indent:0px;line-height:1.620;margin-top:7px;margin-bottom:7px;text-align:left;\" >\n<span class=\"text69215Font9\"  >Recording your CPD credits\n</span ></p >\n<p  legLH=\"1.691\" style=\"margin-left:0px;text-indent:0px;line-height:1.620;margin-top:7px;margin-bottom:7px;text-align:left;\" >\n<span class=\"text69215Font5\"  >Once you have successfully completed each assessment item, please </span ><span class=\"text69215Font10\"  >self-record </span ><span class=\"text69215Font5\"  >your Group 2 credits (accredited CPD) using the Guild Learning and Development </span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://sso.mycpd.org.au/login\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text69215Font11\"  >myCPD platform. </span></a ><span class=\"text69215Font6\"  >&nbsp;</span ><span class=\"text69215Font5\"  >If you do not have a myCPD profile - you can </span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://www.guild.org.au/training/mycpd-registration-form\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text69215Font12\"  >sign up for free</span></a ><span class=\"text69215Font6\" style=\"background-color:transparent\" >\n</span ></p >\n</div>\n');
