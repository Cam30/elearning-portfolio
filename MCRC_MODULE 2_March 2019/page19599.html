text19611.addInnerText('<div id=\"text19611\" style=\"overflow-y:auto;overflow-x:hidden;\"><a id=\"text19611anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19611Font2\"  >Overview\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19611Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text19611Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19611CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19611Font3\"  >The </span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://www.legislation.qld.gov.au/LEGISLTN/ACTS/2016/16AC053.pdf\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text19611Font4\"  >Public Health (Medicinal Cannabis) Act 2016 </span></a ><span class=\"text19611Font3\"  >(passed by QLD government) and subordinate Regulations came into effect on 1 March 2017.\n</span ></li >\n<li  class=\"text19611Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19611CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19611Font3\"  >The </span ><span class=\"text19611Font5\"  >Act</span ><span class=\"text19611Font3\"  > provides protection from civil liability when prescribing and dispensing Medicinal Cannabis products, provided the medicinal practitioner has acted in good faith and due diligence (protection may not extend to TGA approval process)\n</span ></li >\n<li  class=\"text19611Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19611CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19611Font3\"  >Removes Medicinal Cannabis products from other health legislation, in particular the HDPR\n</span ></li >\n<li  class=\"text19611Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19611CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19611Font3\"  >Nabiximols (Sativex) was left in the HDPR – as it is a registered product in Australia as it is an \"approved good\" (refer to the </span ><span class=\"text19611Font5\"  >Act.</span ><span class=\"text19611Font3\"  >)\n</span ></li >\n<li  class=\"text19611Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19611CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19611Font3\"  >Due to this Act, cannabidiol as a Medicinal Cannabis product (which is a schedule 4 medicine, when containing &lt;2% of other cannabinoids e.g. THC), is to be treated as an \'unapproved therapeutic good\' and requires relevant Queensland approvals for prescribing and dispensing, in addition to Commonwealth requirements. &nbsp;\n</span ></li >\n<li  class=\"text19611Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19611CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19611Font3\"  >Nurses to administer (within hospitals) legally prescribed Medicinal Cannabis products. This includes enrolled nurses.\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19611Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19611Font2\"  >Manufacturers</span ><span class=\"text19611Font7\" style=\"background-color:transparent\" >\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19611Font7\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text19611Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19611CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19611Font3\"  >Require an approval to operate in QLD – in addition to licences/permits from both the ODC and TGA\n</span ></li >\n<li  class=\"text19611Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19611CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19611Font3\"  >The order of approval is ODC → TGA → QLD health. \n</span ></li >\n<li  class=\"text19611Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19611CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19611Font3\"  >Note: Queensland health are supplying the one approval for a wholesaler who is also the manufacturer.\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19611Font9\"  ><br /></span ><span class=\"text19611Font2\"  >Wholesalers</span ><span class=\"text19611Font3\" style=\"background-color:transparent\" >\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19611Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text19611Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19611CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19611Font3\"  >Also require an approval and licence through QLD Health and ODC. \n</span ></li >\n<li  class=\"text19611Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19611CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19611Font3\"  >The order of approval is: QLD Health → ODC. \n</span ></li >\n<li  class=\"text19611Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19611CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19611Font3\"  >If wholesaler is NOT a manufacturer, QLD health only issues a wholesaling approval\n</span ></li >\n</ul >\n</div>\n');
text19611.build()

text19610.addInnerText('<div id=\"text19610\" style=\"overflow-y:auto;overflow-x:hidden;\"><a id=\"text19610anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19610Font2\"  >Prescribing\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19610Font2\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19610Font3\"  >Monday 30th July 2018</span ><span class=\"text19610Font4\"  >, the TGA has launched a new online portal for lodging applications for products covered under the Special Access Scheme, including cannabis medicines. This online lodgement system is currently available for health practitioners in NSW, Victoria, and Queensland and will provide prescribers with the ability to submit applications to the TGA and relevant State Health Department simultaneously. \n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19610Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19610Font4\"  >The TGA advises that while lodgement of SAS applications and notifications via the online system is not mandatory, it is the preferred method of submission. \n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19610Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19610Font4\"  >Further information about the TGA Special Access Scheme online system and how to register for access can be found </span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://www.tga.gov.au/special-access-scheme-online-system\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text19610Font5\"  >here.  </span></a ><span class=\"text19610Font7\" style=\"background-color:transparent\" >\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19610Font2\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text19610Font4\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:3px;margin-bottom:0px; list-style-image:url(\'images/text19610CircleBulletFont9.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19610Font4\"  >Doctors to obtain, possess, prescribe and supply (if needed), doctors must also provide a treatment report to the Chief Executive at 3 monthly intervals\n</span ></li >\n<li  class=\"text19610Font4\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:3px;margin-bottom:0px; list-style-image:url(\'images/text19610CircleBulletFont9.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19610Font4\"  >The below requirements are in addition to the mandatory TGA approvals (i.e. SAS A/B or Authorised Prescriber).\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:3px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19610Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:3px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19610Font2\"  >Doctors can legally prescribe Medicinal Cannabis products through 2 pathways in Queensland</span ><span class=\"text19610Font8\"  >:</span ><span class=\"text19610Font4\" style=\"background-color:transparent\" >\n</span ></p >\n<ol  start=\"1\" style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text19610Font4\" style=\"line-height:1.107;position:relative;padding-left:10px;list-style-type:decimal;margin-left:34px;margin-top:3px;margin-bottom:0px;\"><span class=\"text19610Font3\"  >Single-patient prescriber:</span ><span class=\"text19610Font4\"  > both general practitioners and medical specialists – required to provide clinical evidence – once QLD health approval granted, apply to TGA via SAS B<br />&nbsp;\n</span ></li >\n<li  class=\"text19610Font4\" style=\"line-height:1.107;position:relative;padding-left:10px;list-style-type:decimal;margin-left:34px;margin-top:3px;margin-bottom:0px;\"><span class=\"text19610Font3\"  >Patient class prescriber pathway:</span ><span class=\"text19610Font4\"  > medical specialists only once QLD health approval granted, apply to TGA for either SAS B or authorised prescriber \n</span ></li >\n</ol >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:3px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19610Font8\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:3px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19610Font8\"  >Conditions for which Medicinal Cannabis is indicated: </span ><span class=\"text19610Font4\" style=\"background-color:transparent\" >\n</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text19610Font4\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:3px;margin-bottom:0px; list-style-image:url(\'images/text19610CircleBulletFont9.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19610Font4\"  >Severe muscle spasms/other symptoms of multiple sclerosis\n</span ></li >\n<li  class=\"text19610Font4\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:3px;margin-bottom:0px; list-style-image:url(\'images/text19610CircleBulletFont9.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19610Font4\"  >Chemotherapy-induced nausea and vomiting\n</span ></li >\n<li  class=\"text19610Font4\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:3px;margin-bottom:0px; list-style-image:url(\'images/text19610CircleBulletFont9.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19610Font4\"  >Some types of epilepsy with severe seizures\n</span ></li >\n<li  class=\"text19610Font4\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:3px;margin-bottom:0px; list-style-image:url(\'images/text19610CircleBulletFont9.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19610Font4\"  >Palliative care (cachexia, nausea and vomiting, pain)\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:3px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19610Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:3px;margin-bottom:0px;text-align:center;\" >\n<span class=\"text19610Font3\"  >Pharmacists must gain dispensing approval from Queensland Health to be able to dispense </span ><span class=\"text19610Font4\" style=\"background-color:transparent\" >\n</span ></p >\n</div>\n');
text19610.build()

text19612.addInnerText('<div id=\"text19612\" style=\"overflow-y:auto;overflow-x:hidden;\"><a id=\"text19612anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font2\"  >Dispensing\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font3\"  >According to QLD Health, \n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font3\"  >\"If you agree to be the dispenser, when the doctor applies for approval with QLD Health, and the TGA, they will nominate you as the pharmacist to dispense.\"\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font4\"  >Pharmacist pre-requisites</span ><span class=\"text19612Font3\" style=\"background-color:transparent\" >\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font3\"  >The nominated pharmacist must apply to the Chief Executive (CE) QLD Health for approval to dispense. &nbsp;The application process involves:\n</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text19612Font6\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19612CircleBulletFont11.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19612Font3\"  >Completing the </span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://www.health.qld.gov.au/__data/assets/pdf_file/0026/640259/application-dispensing-approval.pdf\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text19612Font6\"  >application for approval to dispense Medicinal Cannabis (PDF, 176 KB)</span></a ><span class=\"text19612Font3\" style=\"background-color:transparent\" >\n</span ></li >\n<li  class=\"text19612Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19612CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19612Font3\"  >Preparing a </span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://www.health.qld.gov.au/__data/assets/pdf_file/0023/644018/medicinal-cannabis-management-plan.pdf\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text19612Font8\"  >Medicinal Cannabis Management Plan (PDF, 133 KB) </span></a ><span class=\"text19612Font3\" style=\"background-color:transparent\" >\n</span ></li >\n<li  class=\"text19612Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19612CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19612Font3\"  >Submit a </span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://www.health.qld.gov.au/__data/assets/pdf_file/0021/640263/notification-management-plan.pdf\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text19612Font10\"  >Notification of Medicinal Cannabis management plan </span></a ><span class=\"text19612Font3\"  >– the current notification form requests a copy of the management plan. &nbsp;However, QLD Health have advised that this requirement is in the process of being revised and the plan will not need to be submitted to QLD health however must be presented when requested.\n</span ></li >\n<li  class=\"text19612Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19612CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19612Font3\"  >Submit forms to the </span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://www.health.qld.gov.au/public-health/topics/medicinal-cannabis/clinicians/dispensing\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text19612Font12\"  >Medicinal Cannabis Unit</span></a ><span class=\"text19612Font3\" style=\"background-color:transparent\" >\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font3\"  >A pharmacist is authorised to obtain, possess and supply an approved Medicinal Cannabis product to a patient and/or their carer(s) on prescription from an approved single-patient prescriber or patient–class prescriber. A nominated pharmacist can be located at a </span ><span class=\"text19612Font13\"  >public hospital, private hospital </span ><span class=\"text19612Font3\"  >or in the</span ><span class=\"text19612Font13\"  > community</span ><span class=\"text19612Font3\"  >. The nominated pharmacist should not dispense more than requested by the prescriber per dispensing. \n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font4\"  >Monitoring and reporting requirement\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font3\"  >The nominated pharmacist should: \n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text19612Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19612CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19612Font3\"  >comply with all reporting and recording requirements, as set down by the Public Health (Medicinal Cannabis) Regulation 2017 (PHMCR) \n</span ></li >\n<li  class=\"text19612Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19612CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19612Font3\"  >&nbsp;report each dispensing event to the CE by forwarding a copy of the Medicinal Cannabis prescription by fax to (07) 3328 9821 or a scanned copy by email to MRQ@health.qld.gov.au within 72 hours\n</span ></li >\n<li  class=\"text19612Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text19612CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text19612Font3\"  >ensure any excess or unused stock is disposed of and destroyed in line with the requirements under the PHMCR \n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font4\"  >Storage requirements </span ><span class=\"text19612Font3\" style=\"background-color:transparent\" >\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text19612Font3\"  >Storage requirements for Medicinal Cannabis products are outlined in </span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://www.health.qld.gov.au/__data/assets/pdf_file/0025/634165/med-cannabis-stock-security.pdf\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text19612Font14\"  >Standard for security of Medicinal Cannabis stock, January 2017 (PDF, 326 KB)</span></a ><span class=\"text19612Font3\" style=\"background-color:transparent\" >\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:center;\" >\n<span class=\"text19612Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:center;\" >\n<span class=\"text19612Font3\"  >It is strongly recommended to regularly check the </span ><span class=\"text19612Font16\"  >QLD Health website</span ><span class=\"text19612Font3\"  > for updates on the Medicinal Cannabis space. </span ><span class=\"text19612Font17\" style=\"background-color:transparent\" >\n</span ></p >\n</div>\n');
