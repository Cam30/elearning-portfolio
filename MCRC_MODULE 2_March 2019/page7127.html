text7130.addInnerText('<div id=\"text7130\" style=\"overflow-y:auto;overflow-x:hidden;\"><a id=\"text7130anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text7130Font1\"  >Streamlined Process</span ><span class=\"text7130Font2\" style=\"background-color:transparent\" >\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text7130Font1\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text7130Font3\"  >To address the issue of timeliness of patient access to Medicinal Cannabis, in February 2017, the TGA changed Therapeutic Goods Regulation 1990 to allow for the bulk sponsored import of Medicinal Cannabis products for prescription under the Special Access Scheme (Category B) and Authorised Prescriber pathways.\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text7130Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text7130Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text7130CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text7130Font3\"  >This legislation enables companies or sponsors/suppliers authorised by the ODC to import and warehouse Medicinal Cannabis products sourced from overseas.\n</span ></li >\n<li  class=\"text7130Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text7130CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text7130Font3\"  >Prior to this change in legislation, it was necessary for individual patients, their doctors/dispensing pharmacists to go through a lengthy and expensive bureaucratic process to allow individual importation of products\n</span ></li >\n<li  class=\"text7130Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text7130CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text7130Font3\"  >Bulk sponsored imported Medicinal Cannabis products cannot be accessed if prescriber is using Special Access Scheme A (SAS A)\n</span ></li >\n<li  class=\"text7130Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text7130CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text7130Font3\"  >The imported medicinal cannabis must be held under direct control of the importer/sponsor until the goods are authorised for supply under SAS-B or AP pathways.\n</span ></li >\n<li  class=\"text7130Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text7130CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text7130Font3\"  >For medicinal practitioners and pharmacists using the above prescription pathways, there are no delays to access these products as they are readily available in Australia (and do not need to be imported on a case-by-case basis)\n</span ></li >\n<li  class=\"text7130Font3\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:16px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text7130CircleBulletFont8.png\'); padding-left:7px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text7130Font3\"  >State/Territory distribution and wholesaling licenses may also be required for bulk imports in certain jurisdictions (for example, in Queensland). &nbsp;\n</span ></li >\n<li  class=\"text7130Font4\" data-bltIndnt=\"0\" style=\"line-height:1.107;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text7130CircleBulletFont9.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text7130Font3\"  >Products are stored according to bulk storage of schedule 8 medicines</span ><span class=\"text7130Font4\" style=\"background-color:transparent\" >\n</span ></li >\n</ul >\n</div>\n');
