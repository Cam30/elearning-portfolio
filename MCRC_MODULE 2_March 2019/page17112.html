text17124.addInnerText('<div id=\"text17124\" style=\"overflow-y:auto;overflow-x:hidden;\"><a id=\"text17124anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17124Font2\"  >Overview<br /></span ><span class=\"text17124Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17124Font4\"  >In NSW, Medicinal Cannabis products are schedule 8 products (or schedule 4 for cannabidiol). New South Wales has \"unregistered product\" changes to their Drugs and Poisons legislation.\n</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17124Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17124Font5\"  >Note</span ><span class=\"text17124Font4\" style=\"background-color:transparent\" >\n</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17124Font5\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17124Font5\"  >\"The NSW Government also has the Medicinal Cannabis Compassionate Use Scheme to extend compassion to adults with a terminal illness.</span ><span class=\"text17124Font4\"  > The scheme provides guidelines for NSW Police Force officers to help them determine the appropriate circumstances in which to use their discretion not to charge adults with terminal illness who use cannabis and/or cannabis products to alleviate their symptoms, as well as carers who assist them.\" \n</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17124Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17124Font4\"  >This is a police discretionary power, not a full amnesty. For more information on this scheme, refer to </span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://www.medicinalcannabis.nsw.gov.au/regulation/medicinal-cannabis-compassionate-use-scheme\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text17124Font6\"  >Medicinal Cannabis Compassionate Use Scheme</span></a ><span class=\"text17124Font7\" style=\"background-color:transparent\" >\n</span ></p >\n</div>\n');
text17124.build()

text17125.addInnerText('<div id=\"text17125\" style=\"overflow-y:auto;overflow-x:hidden;\"><a id=\"text17125anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17125Font2\"  >Dispensing<br /></span ><span class=\"text17125Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17125Font4\"  >Medicinal Cannabis products must be treated as schedule 8 medicines (other than Schedule 4 cannabidiol). &nbsp;\n</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17125Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17125Font4\"  >A pharmacist can dispense a prescription for a Schedule 8 cannabis product only:<br />\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text17125Font5\" data-bltIndnt=\"12\" style=\"line-height:1.127;position:relative;margin-left:27px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text17125CircleBulletFont10.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:12\n} --><span class=\"text17125Font4\"  >if the </span ><span class=\"text17125Font5\"  >prescriber is authorised by NSW Health to prescribe it\n</span ></li >\n<li  class=\"text17125Font4\" data-bltIndnt=\"12\" style=\"line-height:1.127;position:relative;margin-left:27px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text17125CircleBulletFont9.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:12\n} --><span class=\"text17125Font5\"  >only at the pharmacy specified in the authority</span ><span class=\"text17125Font4\"  > and written on the prescription by the prescriber. \n</span ></li >\n<li  class=\"text17125Font5\" data-bltIndnt=\"12\" style=\"line-height:1.127;position:relative;margin-left:27px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text17125CircleBulletFont10.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:12\n} --><span class=\"text17125Font5\"  >The prescription must have a NSW authority number. \n</span ></li >\n<li  class=\"text17125Font4\" data-bltIndnt=\"12\" style=\"line-height:1.127;position:relative;margin-left:27px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text17125CircleBulletFont9.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:12\n} --><span class=\"text17125Font4\"  >The pharmacy can dispense only the authorised product as received from the licensed manufacturer, importer or wholesaler (or authorised foreign exporter),\n</span ></li >\n<li  class=\"text17125Font4\" data-bltIndnt=\"12\" style=\"line-height:1.127;position:relative;margin-left:27px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text17125CircleBulletFont9.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:12\n} --><span class=\"text17125Font4\"  >The pharmacy cannot manipulate or further compound it.  \n</span ></li >\n<li  class=\"text17125Font4\" data-bltIndnt=\"12\" style=\"line-height:1.127;position:relative;margin-left:27px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text17125CircleBulletFont9.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:12\n} --><span class=\"text17125Font4\"  >Nor can a pharmacy obtain cannabis raw material to manufacture or compound a product in a pharmacy\n</span ></li >\n</ul >\n<p  legLH=\"1.127\" style=\"margin-left:12px;text-indent:-12px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17125Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:12px;text-indent:-12px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17125Font4\"  >According to NSW Health, a pharmacist can dispense a prescription for a Schedule 8 cannabis product (other than Schedule 4 cannabidiol) only if the prescriber is authorised by NSW health to prescribe it and (except for nabiximols, dronabinol and nabilone) only at the pharmacy specified in the authority and written on the prescription by the prescriber.\n</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:center;\" >\n<span class=\"text17125Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:center;\" >\n<span class=\"text17125Font5\"  >For more information on manufacture, import and wholesale supply in NSW, &nbsp;refer to</span ><span class=\"text17125Font7\"  > </span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'http://www.health.nsw.gov.au/pharmaceutical/Pages/cannabis-products.aspx\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text17125Font8\"  >Cannabis Medicines</span></a ><span class=\"text17125Font9\" style=\"background-color:transparent\" >\n</span ></p >\n</div>\n');
text17125.build()

text17123.addInnerText('<div id=\"text17123\" style=\"overflow-y:auto;overflow-x:hidden;\"><a id=\"text17123anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17123Font2\"  >Prescribing\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17123Font2\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text17123Font4\" data-bltIndnt=\"0\" style=\"line-height:1.127;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text17123CircleBulletFont9.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text17123Font3\"  >Monday 30th July</span ><span class=\"text17123Font4\"  >, the TGA &nbsp;launched a new online portal for lodging applications for products covered under the Special Access Scheme, including cannabis medicines. This online lodgement system is currently available for health practitioners in NSW, Victoria, and Queensland and will provide prescribers with the ability to submit applications to the TGA and relevant State Health Department simultaneously. \n</span ></li >\n</ul >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17123Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text17123Font4\" data-bltIndnt=\"0\" style=\"line-height:1.127;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text17123CircleBulletFont9.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text17123Font4\"  >The TGA advises that while lodgement of SAS applications and notifications via the online system is not mandatory, it is the preferred method of submission. \n</span ></li >\n</ul >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17123Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text17123Font4\" data-bltIndnt=\"0\" style=\"line-height:1.127;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text17123CircleBulletFont9.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text17123Font4\"  >Further information about the TGA Special Access Scheme online system and how to register for access can be found </span ><a href=\"https://www.tga.gov.au/special-access-scheme-online-system\"  ><span class=\"text17123Font5\"  >here</span></a ><span class=\"text17123Font4\"  >.</span ><span class=\"text17123Font2\" style=\"background-color:transparent\" >\n</span ></li >\n</ul >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17123Font6\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text17123Font4\" data-bltIndnt=\"0\" style=\"line-height:1.127;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text17123CircleBulletFont9.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text17123Font4\"  >On 2 March 2018, the NSW &nbsp;and Commonwealth governments announced a change in the prescribing process in NSW to improve individual patient access to unregistered cannabis medicines by introducing a single application process.\n</span ></li >\n<li  class=\"text17123Font4\" data-bltIndnt=\"0\" style=\"line-height:1.127;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text17123CircleBulletFont9.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text17123Font4\"  >Special Access Scheme (SAS) forms are now available for medical practitioners prescribing for patients in NSW who would like to notify/apply to access and prescribe an unapproved medicinal cannabis product to a patient in NSW.\n</span ></li >\n<li  class=\"text17123Font4\" data-bltIndnt=\"0\" style=\"line-height:1.127;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text17123CircleBulletFont9.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text17123Font4\"  >The SASA and SASB forms include both TGA\'s requirements under the SAS and the requirements for NSW\'s Health\'s Application for Authority Application form to Prescriber and Supply a Cannabis Product for Human Therapeutic Use. These forms should be submitted once only to the TGA who will forward to NSW. They do not need to be submitted to NSW Health in addition to TGA.\n</span ></li >\n<li  class=\"text17123Font4\" data-bltIndnt=\"0\" style=\"line-height:1.127;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text17123CircleBulletFont9.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text17123Font4\"  >Once submitted, TGA and NSW Health will simultaneously review the information provided. Decision letter/s will then be emailed to those contact details provided on the form.\n</span ></li >\n</ul >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17123Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text17123Font4\" data-bltIndnt=\"0\" style=\"line-height:1.127;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text17123CircleBulletFont9.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text17123Font4\"  >If the cannabis medicine is schedule 8, there is also a requirement for NSW Health authorisation.\n</span ></li >\n</ul >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17123Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17123Font3\"  >Note</span ><span class=\"text17123Font4\" style=\"background-color:transparent\" >\n</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17123Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17123Font4\"  >A Medicinal Cannabis Advisory Service has been set up for doctors in NSW to help in prescribing medicinal cannabis for patients under palliative care. The service started in January 2018 with the State Government admitting doctors have been calling for more support for medicinal cannabis as an emerging area of medicine.\n</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17123Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17123Font3\"  >Number: (02) 4923 6200</span ><span class=\"text17123Font4\" style=\"background-color:transparent\" >\n</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17123Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17123Font4\"  >It is a \'hotline\' where doctors anywhere in NSW can ring the service for guidance from leading clinicians in this emerging area of medicine. &nbsp;Hours of operation are 9am - 5pm.\n</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17123Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  style=\"margin-left:0px;text-indent:0px;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17123Font3\"  >For further information, refer to</span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'http://www.health.nsw.gov.au/pharmaceutical/Pages/cannabis-products.aspx\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text17123Font8\"  > Cannabis Medicines</span></a ><span class=\"text17123Font3\"  >. </span ><span class=\"text17123Font9\" style=\"background-color:transparent\" >\n</span ></p >\n</div>\n');
