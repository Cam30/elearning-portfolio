text17235.addInnerText('<div id=\"text17235\" style=\"overflow-y:auto;overflow-x:hidden;\"><a id=\"text17235anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17235Font2\"  >Prescribing\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17235Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17235Font4\"  >A </span ><span class=\"text17235Font5\"  >section 18A authority (State Approval) </span ><span class=\"text17235Font4\"  >is </span ><span class=\"text17235Font5\"  >only required after 2 months of treatment</span ><span class=\"text17235Font4\"  >, or before commencing treatment where the person is already prescribed a Schedule 8 drug (for a period exceeding 2 months) and for any person the medical practitioner reasonably believes to be dependent on drugs. For more information on section 18A, </span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'http://www.sahealth.sa.gov.au/wps/wcm/connect/public+content/sa+health+internet/health+topics/health+conditions+prevention+and+treatment/medicines/medicinal+cannabis/medicinal+cannabis+patient+access+in+south+Australia\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text17235Font6\"  >click here.</span></a ><span class=\"text17235Font4\"  > \n</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17235Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text17235Font4\" data-bltIndnt=\"0\" style=\"line-height:1.127;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text17235CircleBulletFont9.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text17235Font4\"  >Authorised medical practitioners can legally prescribe Medicinal Cannabis products with Commonwealth approval and State approvals (when required). \n</span ></li >\n<li  class=\"text17235Font4\" data-bltIndnt=\"0\" style=\"line-height:1.127;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text17235CircleBulletFont9.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text17235Font4\"  >A specialist medical practitioner may apply for approval to prescribe Medicinal Cannabis when the patient has tried conventional treatments and these have failed, and there is some clinical evidence that the benefits of using Medicinal Cannabis outweigh the risks.\n</span ></li >\n</ul >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17235Font4\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17235Font4\"  >Note: schedule 4 products do not require SA Health approvals to prescribe and supply (still needs Commonwealth approval)\n</span ></p >\n</div>\n');
text17235.build()

text17236.addInnerText('<div id=\"text17236\"><a id=\"text17236anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17236Font2\"  >Overview\n</span ></p >\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17236Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17236Font4\"  >As a result of federal legislative changes which came into effect in November 2016, </span ><span class=\"text17236Font5\"  >Medicinal Cannabis products are now schedule 8 medicines in South Australia. \n</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17236Font5\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text17236Font4\"  >Existing </span ><a href=\"javascript:var newWnd=ObjLayerActionGoToNewWindow(\'https://www.legislation.sa.gov.au/LZ/C/A/CONTROLLED%20SUBSTANCES%20ACT%201984.aspx\',\'Trivantis_\',\'width=1025,height=701,scrollbars=1,resizable=1,menubar=1,toolbar=1,location=1,status=1\'); \"  ><span class=\"text17236Font6\"  >South Australian Controlled Substances legislation</span></a ><span class=\"text17236Font4\"  > applies to Schedule 8 Medicinal Cannabis drugs. The prescribing and supply of Medicinal Cannabis Schedule 8 medicines is regulated under section 18A of the Controlled Substances Act 1984.</span ><span class=\"text17236Font3\" style=\"background-color:transparent\" >\n</span ></p >\n</div>\n');
text17236.build()
