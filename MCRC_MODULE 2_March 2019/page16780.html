\n</div>\n');

text16792.addInnerText('<div id=\"text16792\" style=\"overflow-y:auto;overflow-x:hidden;\"><a id=\"text16792anc\" style=\"display:block;height:0px;width:0px;\"></a>\n<p  legLH=\"1.107\" style=\"margin-left:0px;text-indent:0px;line-height:1.107;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16792Font2\"  >Overview<br /></span ><span class=\"text16792Font3\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16792Font4\"  >Medicinal Cannabis Controlled Access Scheme:</span ><span class=\"text16792Font5\"  > allows relevant medical specialists to be authorised to prescribe medical cannabis (unregistered cannabinoid products) in limited circumstances where conventional treatment has been unsuccessful. The scheme began 1st September 2017. &nbsp;\n</span ></p >\n<p  legLH=\"1.127\" style=\"margin-left:0px;text-indent:0px;line-height:1.080;margin-top:0px;margin-bottom:0px;text-align:left;\" >\n<span class=\"text16792Font5\" style=\"background-color:transparent\" >\n&nbsp;</span ></p >\n<ul  style=\"list-style-position:outside;text-align:left;\" >\n<li  class=\"text16792Font5\" data-bltIndnt=\"0\" style=\"line-height:1.127;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16792CircleBulletFont10.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16792Font5\"  >At this stage, the access scheme is the this is the only route to access Medicinal Cannabis products in Tasmania. &nbsp;\n</span ></li >\n<li  class=\"text16792Font5\" data-bltIndnt=\"0\" style=\"line-height:1.127;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16792CircleBulletFont10.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16792Font5\"  >The scheme imposes conditions to ensure safety, which include the review of applications by a panel of clinicians.\n</span ></li >\n<li  class=\"text16792Font5\" data-bltIndnt=\"0\" style=\"line-height:1.127;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16792CircleBulletFont10.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16792Font5\"  >GPs will not be authorised to prescribe these products\n</span ></li >\n<li  class=\"text16792Font5\" data-bltIndnt=\"0\" style=\"line-height:1.127;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16792CircleBulletFont10.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16792Font5\"  >Approved storage required\n</span ></li >\n<li  class=\"text16792Font5\" data-bltIndnt=\"0\" style=\"line-height:1.127;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16792CircleBulletFont10.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16792Font5\"  >A consent form is required to be signed, acknowledging and accepting the risks of using an unregistered product.\n</span ></li >\n<li  class=\"text16792Font5\" data-bltIndnt=\"0\" style=\"line-height:1.127;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16792CircleBulletFont10.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16792Font5\"  >Medical specialists would be able to apply to the Controlled Access Scheme for permission to prescribe medical cannabis products for patients where conventional treatments had failed and where there was clinical evidence of a product\'s effectiveness.\n</span ></li >\n<li  class=\"text16792Font5\" data-bltIndnt=\"0\" style=\"line-height:1.127;position:relative;margin-left:15px;margin-top:0px;margin-bottom:0px; list-style-image:url(\'images/text16792CircleBulletFont10.png\'); padding-left:8px;\"><!--{ \ndata-bltIndnt:0\n} --><span class=\"text16792Font5\"  >Products prescribed under the scheme will only be dispensed through Tasmanian Health Service pharmacies</span ><span class=\"text16792Font3\" style=\"background-color:transparent\" >\n</span ></li >\n</ul >\n</div>\n');
